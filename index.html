      Шабашка DNR - Работа, Ремонт, Строительство в Донецке | Мастера и бригады
    </title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 2em;
      }

      .subtitle {
        color: #666;
        font-size: 1.1em;
      }

      .ads-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .ad-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .ad-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .ad-photo {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 15px;
        cursor: pointer;
      }

      .ad-title {
        font-size: 1.3em;
        font-weight: 600;
        color: #333;
        margin-bottom: 10px;
      }

      .ad-description {
        color: #666;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .ad-description.collapsed {
        max-height: 100px;
        overflow: hidden;
        position: relative;
      }

      .ad-description.collapsed::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: linear-gradient(transparent, white);
      }

      .expand-btn {
        background: none;
        border: none;
        color: #667eea;
        cursor: pointer;
        font-size: 0.9em;
        padding: 5px 0;
        margin-top: 5px;
        display: none;
      }

      .expand-btn:hover {
        text-decoration: underline;
      }

      .expand-btn.show {
        display: block;
      }

      .ad-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #eee;
        font-size: 0.9em;
        color: #888;
      }

      .ad-category {
        background: #667eea;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.85em;
      }

      .ad-phone {
        background: #4caf50;
        color: white;
        padding: 8px 20px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
        margin-top: 10px;
        font-weight: 500;
        transition: background 0.3s ease;
      }

      .ad-phone:hover {
        background: #45a049;
      }

      .vk-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #4c75a3;
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9em;
        margin-top: 10px;
        margin-right: 10px;
        transition: all 0.3s ease;
      }

      .vk-button:hover {
        background-color: #3d5f8a;
        transform: translateY(-2px);
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: white;
        font-size: 1.2em;
      }

      footer {
        background: white;
        border-radius: 15px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .footer-links {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .footer-link {
        color: #667eea;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 8px;
        transition: background 0.3s ease;
      }

      .footer-link:hover {
        background: #f0f0f0;
      }

      .footer-link svg {
        width: 24px;
        height: 24px;
      }

      .copyright {
        color: #666;
        margin-top: 20px;
      }

      /* Modal/Lightbox styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        animation: fadeIn 0.3s ease;
      }

      .modal.active {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        max-width: 90%;
        max-height: 90%;
        position: relative;
      }

      .modal-img {
        max-width: 100%;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 8px;
      }

      .modal-close {
        position: absolute;
        top: 20px;
        right: 40px;
        color: white;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        z-index: 1001;
        transition: color 0.3s ease;
      }

      .modal-close:hover {
        color: #667eea;
      }

      .modal-prev,
      .modal-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: white;
        font-size: 40px;
        cursor: pointer;
        padding: 20px;
        user-select: none;
        transition: color 0.3s ease;
      }

      .modal-prev:hover,
      .modal-next:hover {
        color: #667eea;
      }

      .modal-prev {
        left: 20px;
      }

      .modal-next {
        right: 20px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        .ads-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 1.5em;
        }
      }
    </style>

          console.error("Error loading ads:", error);
          document.getElementById("adsContainer").innerHTML =
            '<div class="loading">Ошибка загрузки объявлений</div>';
        }
      }

      function displayAds(ads) {
        const container = document.getElementById("adsContainer");
        if (ads.length === 0) {
          container.innerHTML =
            '<div class="loading">Объявления отсутствуют</div>';
          return;
        }

        container.innerHTML = ads
          .map((ad) => {
            const hasLongText = ad.description && ad.description.length > 200;
            const photoUrls = ad.photo_urls
              ? JSON.parse(ad.photo_urls)
              : ad.photo_url
                ? [ad.photo_url]
                : [];

            return `
                    <div class="ad-card" data-id="${ad.tg_message_id}">
                        ${
                          ad.photo_url
                            ? `
                            <img src="${ad.photo_url}" 
                                 alt="${ad.title}" 
                                 class="ad-photo"
                                 onclick="openModal('${ad.photo_url}', ${JSON.stringify(photoUrls).replace(/"/g, "&quot;")})">
                        `
                            : ""
                        }
                        <div class="ad-title">${ad.title}</div>
                        <div class="ad-description ${hasLongText ? "collapsed" : ""}" id="desc-${ad.tg_message_id}">
                            ${ad.description}
                        </div>
                        ${
                          hasLongText
                            ? `
                            <button class="expand-btn show" onclick="toggleExpand(${ad.tg_message_id}, this)">
                                Показать полностью
                            </button>
                        `
                            : ""
                        }
                        ${ad.phone ? `<a href="tel:${ad.phone}" class="ad-phone"> ${ad.phone}</a>` : ""}
                        ${
                          ad.vk_post_url
                            ? `
                            <a href="${ad.vk_post_url}" 
                               target="_blank" 
                               rel="noopener noreferrer"
                               class="vk-button"
                               onclick="event.stopPropagation()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12.785 16.144s.285.031.429-.171c.132-.185.128-.536.128-.536s-.018-1.635.736-1.879c.742-.241 1.699 1.597 2.715 2.296.764.526 1.344.411 1.344.411l2.714-.038s1.418-.088.743-1.204c-.057-.094-.404-.841-2.08-2.385-1.752-1.617-1.518-1.355.593-4.163 1.284-1.711 1.797-2.754 1.634-3.203-.155-.428-1.098-.314-1.098-.314l-3.143.02s-.235-.033-.41.072c-.17.102-.28.337-.28.337s-.505 1.344-1.18 2.49c-.949 1.617-1.327 1.702-1.485 1.603-.383-.247-.288-.991-.288-1.52 0-1.651.251-2.34-.488-2.515-.246-.059-.425-.098-1.054-.105-.808-.009-1.488.002-1.878.192-.261.128-.463.414-.342.43.152.021.498.093.682.34.239.319.231 1.035.231 1.035s.138 3.618-.322 4.06c-.313.303-.744.321-1.664-.343-.647-.466-1.766-2.677-2.511-4.255-.213-.45-.377-.592-.437-.626-.06-.034-.233-.045-.233-.045l-3.004.019s-.45.013-.613.208c-.146.173-.012.529-.012.529s2.355 5.506 5.028 8.27c2.455 2.542 5.248 2.38 5.248 2.38h1.266s.38-.03.576-.382c.176-.32.034-.874.034-.874s-.085-1.152.517-1.323c.593-.168 1.362 2.816 2.175 4.291 1.489 2.71 4.237 2.55 4.237 2.55l4.237-.06s2.35-.145 1.236-1.998c-.088-.146-.635-1.308-3.275-3.699-2.755-2.496-2.382-2.093.93-6.432 2.016-2.645 2.819-4.26 2.56-4.972-.244-.673-1.719-.497-1.719-.497l-4.909.031s-.367-.051-.636.109c-.264.158-.435.523-.435.523s-.787 2.095-1.845 3.883c-1.484 2.51-2.075 2.642-2.319 2.485-.599-.385-.447-1.54-.447-2.362 0-2.573.39-3.65-.764-3.924-.384-.092-.664-.153-1.646-.164-1.261-.013-2.322.002-2.93.299-.407.199-.722.646-.534.672.237.033.778.145 1.065.531.373.498.36 1.612.36 1.612s.215 5.64-.503 6.332c-.488.472-1.158.5-2.59-.532-.802-.577-2.75-4.176-3.915-6.64-.264-.558-.47-.736-.542-.778-.093-.053-.363-.07-.363-.07l-4.683.03s-.702.02-.954.324c-.227.27-.018.824-.018.824s3.675 8.582 7.843 12.883c3.826 3.957 8.18 3.713 8.18 3.713h1.979s.594-.047.9-.597c.275-.499.053-1.363.053-1.363s-.132-1.794.804-2.062c.925-.262 2.124 4.399 3.387 6.694 2.32 4.22 6.514 3.974 6.514 3.974l6.617-.094s3.67-.226 1.934-3.114c-.137-.228-.99-2.038-5.109-5.7 .158-.435.523-.435.523s-.787 2.095-1.845 3.883c-1.484 2.51-2.075 2.642-2.319 2.485-.599-.385-.447-1.54-.447-2.362 0-4.008.608-5.687-1.191-6.113-.598-.143-1.036-.237-2.566-.254-1.967-.02-3.617.003-4.563.466-.633.31-1.123 1.007-.832 1.046.237.033.778.145 1.065.531.373.498.36 1.612.36 1.612s.215 5.64-.503 6.332c-.488.472-1.158.5-2.59-.532-.802-.577-2.75-4.176-3.915-6.64-.264-.558-.47-.736-.542-.778-.093-.053-.363-.07-.363-.07l-4.683.03s-.702.02-.954.324c-.227.27-.018.824-.018.824s3.675 8.582 7.843 12.883c3.826 3.957 8.18 3.713 8.18 3.713"/>
                                </svg>
                                Открыть ВКонтакте
                            </a>
                        `
                            : ""
                        }
                        <div class="ad-meta">
                            <span class="ad-category">${ad.category}</span>
                            <span>${ad.city} • ${new Date(ad.created_at).toLocaleDateString("ru-RU")}</span>
                        </div>
                    </div>
                `;
          })
          .join("");
      }

      function toggleExpand(adId, btn) {
        const desc = document.getElementById(`desc-${adId}`);
        const isCollapsed = desc.classList.contains("collapsed");

        if (isCollapsed) {
          desc.classList.remove("collapsed");
          btn.textContent = "Свернуть";
        } else {
          desc.classList.add("collapsed");
          btn.textContent = "Показать полностью";
        }
      }

      function openModal(photoUrl, photos) {
        currentPhotos = photos;
        currentPhotoIndex = currentPhotos.indexOf(photoUrl);
        if (currentPhotoIndex === -1) currentPhotoIndex = 0;

        const modal = document.getElementById("photoModal");
        const modalImg = document.getElementById("modalImg");
        modalImg.src = currentPhotos[currentPhotoIndex];
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        const modal = document.getElementById("photoModal");
        modal.classList.remove("active");
        document.body.style.overflow = "auto";
      }

      function changePhoto(direction) {
        currentPhotoIndex += direction;
        if (currentPhotoIndex < 0) currentPhotoIndex = currentPhotos.length - 1;
        if (currentPhotoIndex >= currentPhotos.length) currentPhotoIndex = 0;

        const modalImg = document.getElementById("modalImg");
        modalImg.src = currentPhotos[currentPhotoIndex];
      }

      // Close modal on click outside
      document
        .getElementById("photoModal")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            closeModal();
          }
        });

      // Keyboard navigation
      document.addEventListener("keydown", function (e) {
        const modal = document.getElementById("photoModal");
        if (modal.classList.contains("active")) {
          if (e.key === "Escape") closeModal();
          if (e.key === "ArrowLeft") changePhoto(-1);
          if (e.key === "ArrowRight") changePhoto(1);
        }
      });

      // Load ads on page load
      loadAds();

      // Refresh ads every 5 minutes
      setInterval(loadAds, 300000);
    </script>
  </body>
