name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "$VK_TOKEN" ]; then
            echo "❌ VK_TOKEN is empty"
          else
            echo "✅ VK_TOKEN is set (first 20 chars): ${VK_TOKEN:0:20}..."
          fi

          if [ -z "$VK_GROUP_ID" ]; then
            echo "❌ VK_GROUP_ID is empty"
          else
            echo "✅ VK_GROUP_ID is set: $VK_GROUP_ID"
          fi
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}